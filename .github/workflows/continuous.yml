name: continuous

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore src/MudBlazor.Templates.slnx
      - name: Build
        run: dotnet build src/MudBlazor.Templates.slnx --configuration Release --no-restore
      - name: Pack
        run: dotnet pack src/MudBlazor.Templates.slnx --configuration Release --no-build --output artifacts/packages
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
