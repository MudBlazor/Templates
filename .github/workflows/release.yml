name: release

on:
  push:
    tags:
      - '\d+\.\d+\.\d+'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Pack
        run: dotnet pack src/MudBlazor.Templates.slnx --configuration Release --output artifacts/packages
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: MudBlazor
      - name: NuGet push
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: 'Push: GitHub Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "$NUGET_SOURCE" --api-key "$GITHUB_TOKEN" --skip-duplicate
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
