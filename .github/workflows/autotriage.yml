name: AutoTriage

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issues:
        description: 'Issue or PR numbers (blank = backlog)'
      dry-run:
        description: 'Plan without applying'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    # Only in MudBlazor's own repository, skipping draft PRs, and issues and comments from bots.
    if: >-
      github.repository_owner == 'MudBlazor' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name != 'pull_request_target' && github.event.sender.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: autotriage
      queue: max
    steps:
      - uses: danielchalmers/AutoTriage@v5
        with:
          issues: ${{ inputs.issues }}
          # New activity is triaged live, while a manual run, which can sweep the backlog, only plans unless dry-run is unticked.
          dry-run: ${{ inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TRIAGE }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotriage-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore
